name: Publish

on:
  release:
    types:
      - prereleased
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: 'Release version to publish (e.g. 2.30.0)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve version
        id: resolve
        env:
          VERSION: ${{ inputs.version || github.event.release.tag_name }}
        run: |
          if [ -z "$VERSION" ]; then
            echo "No release version (workflow_dispatch snapshot publish)"
            exit 0
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: version must be in X.Y.Z format: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.version }}

      - name: Set up Snapshot version for Workflow Dispatch
        if: ${{ steps.resolve.outputs.version == '' }}
        run: |
          CURRENT_VERSION=$(grep 'val versionName =' build.gradle.kts | sed -E 's/val versionName = "([^"]+)"/\1/')
          SHORT_SHA=$(git rev-parse --short HEAD)
          SNAPSHOT_VERSION="$CURRENT_VERSION-$SHORT_SHA-SNAPSHOT"
          sed -i "s/val versionName = \".*\"/val versionName = \"$SNAPSHOT_VERSION\"/" build.gradle.kts

      - name: Verify Versions
        if: ${{ steps.resolve.outputs.version != '' }}
        env:
          RELEASE_NAME: ${{ steps.resolve.outputs.version }}
        run: |
          SDK_VERSION=$(grep 'val versionName =' build.gradle.kts | sed -E 's/val versionName = "([^"]+)"/\1/')
          echo "sdk_version: $SDK_VERSION, release.name: $RELEASE_NAME"
          if [ "$SDK_VERSION" != "$RELEASE_NAME" ]; then
            echo "Error: sdk_version ($SDK_VERSION) does not match release.name ($RELEASE_NAME)"
            echo "Ensure that the release name in GitHub matches the sdk_version in build.gradle.kts"
            exit 1
          else
            echo "sdk_version matches release.name"
          fi

      - name: Set up JDK 8
        uses: actions/setup-java@v1
        with:
          java-version: 1.8

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 7.2

      - name: Publish
        run: gradle clean build publishToSonatype closeAndReleaseSonatypeStagingRepository --info
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}

      - name: Convert Prerelease to Release
        if: ${{ steps.resolve.outputs.version != '' }}
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tagName = process.env.VERSION;

            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tagName
              });

              if (!release.prerelease) {
                console.log(`Release ${tagName} is not a prerelease, skipping conversion`);
                return;
              }

              const response = await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                prerelease: false,
                make_latest: true
              });
              
              console.log(`Successfully converted prerelease to release: ${tagName}`);
              console.log(`Release ID: ${response.data.id}`);
              console.log(`Release URL: ${response.data.html_url}`);
              console.log(`Tag: ${response.data.tag_name}`);
            } catch (error) {
              console.error(`Failed to convert prerelease to release: ${error.message}`);
              throw error;
            }
